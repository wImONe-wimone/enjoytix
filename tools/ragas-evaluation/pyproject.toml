[build-system]
requires = ['setuptools==75.6.0', 'wheel==0.45.1']
build-backend = 'setuptools.build_meta'

[project]
name = 'enjoytix-ragas-evaluation'
version = '0.1.0'
description = 'Offline retrieval-context evaluation for EnjoyTix'
requires-python = ">=3.10,<3.11"
dependencies = ['ragas==0.2.15', 'langchain-openai==0.3.14']

[project.scripts]
ragas-evaluate = 'ragas_evaluation.cli:main'

[tool.setuptools.packages.find]
where = ['.']
