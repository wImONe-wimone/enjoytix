dataSources:
  user_ds:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: "jdbc:mysql://127.0.0.1:3306/enjoytix_user?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: root
    password: "1234"
    maximumPoolSize: 20
    minimumIdle: 5
    connectionTimeout: 30000
    idleTimeout: 600000
    maxLifetime: 1800000
    keepaliveTime: 300000
    poolName: EnjoyTixUserHikariPool

rules:
  - !SINGLE
    defaultDataSource: user_ds

props:
  sql-show: false
  sql-simple: true
  check-table-metadata-enabled: false
